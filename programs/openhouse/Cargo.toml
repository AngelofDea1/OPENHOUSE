[package]
name = "openhouse"
version = "0.2.0"
description = "Publicly verifiable casino bankroll and non-custodial gaming on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "openhouse"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }

[dev-dependencies]
solana-program-test = "=1.18.26"
solana-sdk = "=1.18.26"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
